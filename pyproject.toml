[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "misfit-medical"
# Keep in sync with misfit/__init__.py (guarded by tests/unit/test_packaging.py).
version = "0.1.2-alpha"
requires-python = ">= 3.10"
description = "MISFIT: Medical Imaging Semantic Foundation Toolkit for training large-scale medical imaging foundation models."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Adrian Celaya", email = "acelaya0@gmail.com"},
    {name = "David Fuentes", email = "dtfuentes@mdanderson.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
keywords = [
    "deep learning",
    "foundation model",
    "self-supervised learning",
    "medical image analysis",
    "medical imaging",
    "pretraining",
    "vision transformer",
    "masked autoencoder",
]
dependencies = [
    "torch",
    "monai",
    "nibabel",
    "numpy",
    "pandas",
    "pyarrow",
    "rich",
    "scikit-learn",
    "einops",
    "scikit-image",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "packaging",
]

[project.urls]
homepage = "https://github.com/mist-medical/MISFIT"
repository = "https://github.com/mist-medical/MISFIT"
documentation = "https://misfit-medical.readthedocs.io/"

[project.scripts]
misfit_index    = "misfit.cli.index_entrypoint:index_entry"
misfit_train    = "misfit.cli.train_entrypoint:train_entry"
misfit_evaluate = "misfit.cli.evaluate_entrypoint:evaluate_entry"
misfit_inspect  = "misfit.cli.inspect_entrypoint:inspect_entry"
misfit_encode      = "misfit.cli.encode_entrypoint:encode_entry"
misfit_embed       = "misfit.cli.embed_entrypoint:embed_entry"
misfit_embed_train = "misfit.cli.embed_train_entrypoint:embed_train_entry"

[tool.setuptools.packages.find]
include = ["misfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Distributed (gloo multi-process) tests are opt-in; the default run stays
# single-process and CPU-only. Run them with: pytest -m distributed
addopts = "--cov=misfit --cov-report=term-missing -m 'not distributed'"
markers = [
    "distributed: multi-process DDP tests using the gloo backend (run with -m distributed)",
]
filterwarnings = [
    # MONAI uses deprecated non-tuple indexing internally — not our code
    "ignore:Using a non-tuple sequence for multidimensional indexing:UserWarning:monai",
    # Expected behaviour: 4D volumes fall back to first frame
    "ignore:.*4D volume encountered during training.*:UserWarning",
    "ignore:.*4D volume detected.*:UserWarning",
    # Expected behaviour: constant/empty volumes fall back to full-volume stats
    "ignore:.*foreground detection returned an empty mask.*:UserWarning",
    # CPU-only test machines don't have CUDA — autocast disables itself
    "ignore:User provided device_type of 'cuda', but CUDA is not available:UserWarning",
    # CPU-only / pre-Ampere test machines: resolve_amp downgrades BF16 → FP32
    "ignore:AMP was requested but .* has no hardware BF16 support:UserWarning",
]

[tool.coverage.run]
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter, not enforced here
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]  # bugbear rules are too noisy in test files

[tool.codespell]
# node_modules/ is the git-ignored Prettier tooling; coverage.svg is generated.
skip = "./.git,./node_modules,./htmlcov,./*.egg-info,./coverage.svg"
# Domain terms / abbreviations that are not misspellings:
#   nd = patch-grid depth count (paired with nh, nw) in the tiling loops
ignore-words-list = "nd"
