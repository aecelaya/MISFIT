# =============================================================================
# Lint
#
# Static checks, run as a status check on pushes/PRs to main and on demand from
# the Actions tab:
#   - ruff check:  style + correctness lint  (config: [tool.ruff] in pyproject.toml)
#   - codespell:   spell-check               (config: [tool.codespell] in pyproject.toml)
#
# Both are check-only (no auto-fix). MISFIT does not enforce `ruff format` — see
# CLAUDE.md — so it is deliberately not run here. ruff is pinned to the version
# used in the `mist` dev environment so local and CI results agree.
# =============================================================================
name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.9" codespell

      # ruff reads [tool.ruff] from pyproject.toml.
      - name: Run ruff check
        run: ruff check .

      # codespell reads [tool.codespell] from pyproject.toml.
      - name: Run codespell
        run: codespell
