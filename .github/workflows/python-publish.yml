# =============================================================================
# Publish Python package to PyPI
#
# Builds the misfit-medical sdist + wheel and uploads them to PyPI. Runs whenever
# a GitHub Release is published, so cutting a release is what ships the package.
# A successful run here also triggers the "Publish Docker Images" workflow.
#
# Requires repo secret: PYPI_API_TOKEN (a PyPI API token — account-scoped for the
# first release, then narrow it to the project).
# =============================================================================
name: Upload Python Package

on:
  release:
    types: [published]

# Only needs to read the source to build it; publishing uses the PyPI token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # PEP 517 build frontend for the sdist + wheel.
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # Upload dist/* to PyPI. Pinned to a commit SHA for supply-chain safety
      # (v1.14.2).
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
